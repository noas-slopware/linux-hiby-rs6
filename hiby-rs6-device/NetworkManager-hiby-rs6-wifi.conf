# HiBy RS6 (hiby-rs6-system): Wi-Fi power save off. With it on, the WCN3990 delivers received frames
# far out of order (thousands of out-of-order TCP segments per download), so TCP never opens its
# window on long-RTT paths: 4 KB/s from arch.bens.haus (~300 ms) vs 2.3 MB/s on a laptop on the same AP.
# NetworkManager takes wlan0 down on suspend anyway, so this only costs power while awake.
[connection]
wifi.powersave=2
