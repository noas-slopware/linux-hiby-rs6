# HiBy RS6 (hiby-rs6-boot). Sourced after /etc/mkinitcpio.conf, so these win.
# No autodetect: images are also built in a chroot on another machine, where it would pick that
# machine's modules; the kernel only has SDM660 drivers anyway. No kms hook: hiby-rs6 adds msm
# and the panel, hiby-rs6-firmware the GPU microcode and zap shader.
HOOKS=(base systemd modconf block filesystems fsck hiby-rs6 hiby-rs6-firmware)
COMPRESSION="zstd"
