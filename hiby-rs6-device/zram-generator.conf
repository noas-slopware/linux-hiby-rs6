# HiBy RS6: aggressive compressed swap in RAM (Noa, 2026-10-24): zstd at twice the RAM, priority
# 300; the arch_swap1/2 partitions (activated by systemd-gpt-auto-generator) stay behind it at the
# default priority. zswap is off (hiby-rs6-zswap.tmpfiles), so pages aren't compressed twice.
[zram0]
zram-size = ram * 2
compression-algorithm = zstd
swap-priority = 300
