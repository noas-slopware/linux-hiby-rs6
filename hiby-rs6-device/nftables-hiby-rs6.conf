#!/usr/bin/nft -f
# HiBy RS6 firewall (hiby-rs6-system): Arch's default ruleset (SSH only) plus Tailscale's direct-connection
# port and what the USB network needs (DHCP and DNS for the host on usb0). nftables.service loads this
# file instead of /etc/nftables.conf (drop-in nftables.service.d/50-hiby-rs6.conf); to use your own rules,
# override that drop-in in /etc/systemd/system/nftables.service.d/.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport ssh accept comment "allow sshd"
    udp dport 41641 accept comment "allow Tailscale direct connections (tailscaled's default port)"
    iifname "usb0" udp dport { bootps, domain } accept comment "USB network: DHCP and DNS for the host"
    iifname "usb0" tcp dport domain accept comment "USB network: DNS for the host"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
  }
}
