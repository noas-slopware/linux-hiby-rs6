# HiBy RS6 (hiby-rs6-system): a short press of the power key suspends, whatever the desktop. systemd's
# default HandlePowerKey=poweroff shut the RS6 down when the key was pressed to sleep. A desktop that
# handles the key itself overrides this (hiby-rs6-plasma's 60-hiby-rs6-plasma.conf: ignore, powerdevil).
[Login]
HandlePowerKey=suspend
