# HiBy RS6: PipeWire and WirePlumber set realtime scheduling themselves (libpipewire-module-rt,
# rt.prio 88, nice -11) for users in "audio", as Arch's realtime-privileges does for "realtime".
# Through rtkit instead, module-rt caps every realtime thread at rtkit's 200 ms of CPU without
# blocking (RLIMIT_RTTIME), and the aptX encoder in WirePlumber's data loop got SIGKILLed.
@audio - rtprio 95
@audio - nice -11
@audio - memlock 4194304
