# HiBy RS6 coaxial S/PDIF output (rs6-spdif)
#
# rs6_spdif[:CARD[,CS]]  PCM: IEC 60958 biphase-mark encoder in front of the card's playback
#                        PCM, plays S16_LE/S24_LE/S32_LE stereo at 44.1k..384k bit-perfect.
#                        CS = consumer (IEC 60958-3 channel status, default) or stock (all
#                        zero, as the stock HiBy HAL).
# rs6_jack[:CARD]        controls "SPDIF Jack" and "DAC Jack" from the kernel's Output
#                        Target, for the UCM jacks (PipeWire picks the sink from them).

pcm.rs6_spdif {
	@args [ CARD CS ]
	@args.CARD {
		type string
		default "HiByRS6"
	}
	@args.CS {
		type string
		default "consumer"
	}
	type rs6_spdif
	card $CARD
	channel_status $CS
	hint {
		show on
		description "HiBy RS6 coaxial S/PDIF output"
	}
}

ctl.rs6_jack {
	@args [ CARD ]
	@args.CARD {
		type string
		default "HiByRS6"
	}
	type rs6_jack
	card $CARD
}
