# HiBy RS6: volume only on the NJW1195A, its 100 hardware steps like the stock wheel.
# With the mixer's dB scale, PipeWire's ACP applies the difference between the requested
# volume and the nearest hardware step in software, to every sample: no longer bit-perfect.
# ignore-dB keeps the volume on the hardware steps and the samples untouched.
# No pro-audio profile: the DAC is only usable through the UCM HiFi profile (it sets up
# the route), and a restored pro-audio profile left the card silent (2026-10-21).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
        api.acp.disable-pro-audio = true
      }
    }
  }
  # The coax sink (UCM device SPDIF, the rs6_spdif encoder): the card PCM behind it moves
  # its position once per 960-frame period (480 audio frames), and the plugin cannot flag
  # itself as a batch device, so keep that much more queued than the graph needs.
  # Bit-perfect at 100 % volume (coax has no hardware volume; PipeWire scales in software
  # below that).
  {
    matches = [
      # UCM hands PipeWire the name with its private prefix: _ucm0001.rs6_spdif:HiByRS6
      { api.alsa.path = "~.*rs6_spdif:.*" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
      }
    }
  }
]

# The music player's exclusive stream takes the DAC over (see the script). The other script
# frees the card PCM for the other output as soon as a jack is plugged or unplugged.
wireplumber.components = [
  {
    name = hiby-rs6/exclusive-takeover.lua, type = script/lua
    provides = custom.hiby-rs6.exclusive-takeover
  }
  {
    name = hiby-rs6/output-handover.lua, type = script/lua
    provides = custom.hiby-rs6.output-handover
  }
]

wireplumber.profiles = {
  main = {
    custom.hiby-rs6.exclusive-takeover = required
    custom.hiby-rs6.output-handover = required
  }
}
