# HiBy RS6: Elisa plays bit-perfect. Its stream is exclusive, so nothing is mixed into it and
# the DAC follows the track's rate (pipewire.conf.d/50-hiby-rs6.conf allows every rate the
# FPGA takes); no channel remixing, no dither. Other apps share the DAC through the mixer
# whenever Elisa isn't holding it.
pulse.rules = [
  {
    matches = [
      { application.process.binary = "elisa" }
    ]
    actions = {
      update-props = {
        node.exclusive = true
        channelmix.disable = true
        dither.method = none
      }
    }
  }
]
