# HiBy RS6: q6 MultiMedia1 -> SEC_MI2S_RX -> hm100 FPGA DAC (+ NJW1195A volume).
# PCM: S32_LE samples (sent to the DAC as hi/lo 16-bit word pairs) at the track rate;
# on the coax output S/PDIF cells at twice the audio rate (docs/audio.md, "The coax stream format").
SectionVerb {
	# The route is the card's only path and stays on (FixedBootSequence in the card file):
	# switching it off with the verb made any PCM open outside the verb fail with
	# "no backend DAIs enabled" at error level. DAPM powers the path down when idle.
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		TQ "HiFi"
	}
}

# Two devices on the card's one playback PCM, exactly one usable at a time. Where a stream
# plays is the hm100 'Output' control: "Auto" follows the jacks like the stock HAL (nothing
# plugged in = the coaxial S/PDIF pin), and the RS6 DAC page/tile can pin one. UCM must not
# set it, or every profile activation (login, port switch) would overwrite that choice.
# The kernel reports the result in the read-only 'Output Target'; the rs6_jack control plugin
# (rs6-spdif) turns it into two jacks, so PipeWire offers the sink that can play and makes it
# the default, as for any headphone jack.

# The DAC: 3.5 mm, 4.4 mm balanced, line out, balanced line out.
SectionDevice."Headphones" {
	Comment "DAC output (3.5 mm / 4.4 mm / line out)"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Headphone"
		PlaybackPriority 200
		JackCTL "rs6_jack:${CardId}"
		JackControl "DAC Jack"
	}
}

# UCM resolves PlaybackPCM in its own ALSA configuration, which holds only pcm.hw and ctl.hw
# (ucm2/lib/generic.conf), so the coax encoder PCM is declared here. JackCTL is not rewritten:
# rs6_jack comes from the system configuration (alsa.conf.d/50-rs6-spdif.conf).
LibraryConfig.rs6spdif.Config {
	pcm.rs6_spdif {
		@args [ CARD ]
		@args.CARD.type string
		type rs6_spdif
		card $CARD
	}
}

# Coax (S/PDIF over the USB-C coax cable): the FPGA forwards the I2S data line to the pin,
# so the stream must already be IEC 60958 biphase-mark cells. The rs6_spdif PCM plugin
# (rs6-spdif) encodes them, bit-perfect at 44.1k..384k, and holds the card PCM only while
# Output Target is Spdif. No hardware volume: the analog side is off on this output.
SectionDevice."SPDIF" {
	Comment "Coaxial S/PDIF output"

	Value {
		PlaybackPCM "rs6_spdif:${CardId}"
		PlaybackChannels 2
		PlaybackPriority 100
		JackCTL "rs6_jack:${CardId}"
		JackControl "SPDIF Jack"
	}
}
