# HiBy RS6: the DAC runs at the track rate (NOS by default), so let the graph follow the
# stream instead of resampling everything to 48 kHz.
context.properties = {
	default.clock.rate          = 44100
	default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 705600 768000 ]
}
