Syntax 4

# The q6 MultiMedia1 -> SEC_MI2S_RX route is the card's only playback path: set it at every
# boot, before anything opens the PCM (alsactl runs this on card add, saved state or not).
FixedBootSequence [
	cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
]

SectionUseCase."HiFi" {
	File "/HiBy/RS6/HiFi.conf"
	Comment "Music"
}
