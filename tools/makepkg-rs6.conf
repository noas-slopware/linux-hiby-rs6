#!/hint/bash
# /etc/makepkg.conf.d/rs6.conf in the rs6-builder image: our own packages target the RS6's real
# baseline, ARMv8.0 + CRC32 + the ARMv8.0 crypto extension (AES, PMULL, SHA1, SHA256), tuned for its
# Cortex-A73/A53 pair. bens' packages stay plain -march=armv8-a. mkimages-rs6.sh refuses to build the
# image unless bens' CFLAGS start with "-march=armv8-a " and gcc accepts the -mtune below.
CFLAGS="-march=armv8-a+crc+crypto -mtune=cortex-a73.cortex-a53 ${CFLAGS#-march=armv8-a }"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"
BUILDENV=(!distcc color ccache check !sign)
