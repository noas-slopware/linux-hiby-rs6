# pacman.conf for building the public image (mkpublic-rs6.sh): pacman-rs6.conf with [rs6] from the published
# repository (GitHub Pages, as rs6-mirrorlist lists first) instead of the local repo dir, so the image gets the
# published packages and the published rs6.db. On the device mkimage-rs6.sh swaps the [rs6] block for the
# rs6-mirrorlist Include.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://arch.bens.haus/repos/$repo/os/$arch

[rs6]
SigLevel = Never
Server = https://noas-slopware.github.io/linux-hiby-rs6/arch/$arch

[extra]
Server = https://arch.bens.haus/repos/$repo/os/$arch
