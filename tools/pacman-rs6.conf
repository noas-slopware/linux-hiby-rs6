# pacman.conf for the RS6 build container and image builder: Arch Linux Ports ARMv8.0 repos (arch.bens.haus)
# only, never drzee's ARMv8.2 ones; [rs6] between [core] and [extra] so the RS6 forks of extra packages win.
# In the container [rs6] is the mirror directory bind-mounted at /repo; on the device mkimage-rs6.sh swaps
# that line for the rs6-mirrorlist Include.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://arch.bens.haus/repos/$repo/os/$arch

[rs6]
SigLevel = Never
Server = file:///repo

[extra]
Server = https://arch.bens.haus/repos/$repo/os/$arch
