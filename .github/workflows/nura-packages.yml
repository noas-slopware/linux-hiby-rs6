# Builds the Nura packages of the pmos branch for aarch64 with pmbootstrap, natively
# on GitHub's arm64 runners, and publishes them as an apk repository on GitHub Pages and on
# YuruMirror:
#   https://noas-slopware.github.io/linux-hiby-rs6/edge
#   https://mirror.funami.tech/linux-hiby-rs6/nura/edge
# Only packages whose build is not published yet are built (or all of them with force): plan.py
# gives every package a hash of its pmos directory plus the pmbootstrap and pmaports pins and
# compares it with built.json next to the published APKINDEX. Each package is saved in the actions
# cache as soon as it is built, so a failed or cancelled run keeps what it finished and the next
# run restores it from there instead of building it again. A push to pmos does not run this file by
# itself (push events use the workflow files of the pushed commit); the pmos branch dispatches it
# with .github/workflows/nura-trigger.yml, and the schedule catches anything missed.
name: Nura packages

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every package, even if the published version is current
        type: boolean
        default: false
      pmos_ref:
        description: Commit or branch of the pmos branch to build
        type: string
        default: pmos
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [ci]

concurrency:
  group: nura-packages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PMB_COMMIT: 7d23010a125ca7386fec4e390d14128b6c24d266 # pmbootstrap 3.12.1
  PMAPORTS_COMMIT: 767b10462fb3f0cb591e2e04c20dd2ed4d6e2568 # pmaports main (edge), 2026-10-19
  KEY_NAME: linux-hiby-rs6-6ad9f9de.rsa
  NURA_REPO_URL: https://noas-slopware.github.io/linux-hiby-rs6
  NURA_WORK: /home/runner/nura/work
  NURA_TOOLS: /home/runner/nura/tools
  NURA_PMOS: /home/runner/nura/pmos
  NURA_PKGCACHE: /home/runner/nura-pkgcache
  NURA_FORCE: ${{ inputs.force || false }}

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read # the actions cache list: which packages an earlier run already built
    outputs:
      pmos_sha: ${{ steps.pmos.outputs.sha }}
      any: ${{ steps.plan.outputs.any }}
      versions: ${{ steps.plan.outputs.versions }}
      manifest: ${{ steps.plan.outputs.manifest }}
      restore: ${{ steps.plan.outputs.restore }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      pkgs_linux: ${{ steps.plan.outputs.pkgs_linux }}
      build_mesa: ${{ steps.plan.outputs.build_mesa }}
      pkgs_mesa: ${{ steps.plan.outputs.pkgs_mesa }}
      build_base: ${{ steps.plan.outputs.build_base }}
      pkgs_base: ${{ steps.plan.outputs.pkgs_base }}
      build_qtbase: ${{ steps.plan.outputs.build_qtbase }}
      pkgs_qtbase: ${{ steps.plan.outputs.pkgs_qtbase }}
      build_device: ${{ steps.plan.outputs.build_device }}
      pkgs_device: ${{ steps.plan.outputs.pkgs_device }}
      build_kde: ${{ steps.plan.outputs.build_kde }}
      pkgs_kde: ${{ steps.plan.outputs.pkgs_kde }}
      build_dac: ${{ steps.plan.outputs.build_dac }}
      pkgs_dac: ${{ steps.plan.outputs.pkgs_dac }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pmos_ref || 'pmos' }}
          path: pmos
      - id: pmos
        run: |
          echo "sha=$(git -C pmos rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - name: Set up pmbootstrap (no chroots)
        run: .github/nura/setup.sh
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          force=()
          [ "$NURA_FORCE" = true ] && force=(--force)
          python3 -I .github/nura/plan.py --pmos "$NURA_PMOS" --site "$NURA_REPO_URL" "${force[@]}"

  # Packages an earlier run built and cached but did not publish: one job each takes it from the
  # cache and hands it on as an artifact, like a build job would.
  restore:
    needs: plan
    if: needs.plan.outputs.restore != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        pkg: ${{ fromJSON(needs.plan.outputs.restore) }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.NURA_PKGCACHE }}/${{ matrix.pkg.name }}
          key: ${{ matrix.pkg.key }}
          fail-on-cache-miss: true
      - run: ls -l "$NURA_PKGCACHE/${{ matrix.pkg.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: apks-cached-${{ matrix.pkg.name }}
          path: ${{ env.NURA_PKGCACHE }}/${{ matrix.pkg.name }}/*.apk
          if-no-files-found: error
          retention-days: 7

  # Every build job: checkout of this repository (scripts, public key) plus the pmos commit the
  # plan looked at, then the nura-build action. A job runs when the plan has packages for it and
  # none of the jobs it needs failed; "needs" lists every earlier group it builds against, and the
  # restore job, whose packages it may build against too.
  linux:
    needs: [plan, restore]
    if: >-
      always() && needs.plan.outputs.build_linux == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: linux
          packages: ${{ needs.plan.outputs.pkgs_linux }}
          ccache-size: 3G
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}
          after-builds: ${{ needs.restore.result == 'success' }}

  mesa:
    needs: [plan, restore]
    if: >-
      always() && needs.plan.outputs.build_mesa == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: mesa
          packages: ${{ needs.plan.outputs.pkgs_mesa }}
          ccache-size: 1500M
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}
          after-builds: ${{ needs.restore.result == 'success' }}

  base:
    needs: [plan, restore]
    if: >-
      always() && needs.plan.outputs.build_base == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: base
          packages: ${{ needs.plan.outputs.pkgs_base }}
          ccache-size: 500M
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}
          after-builds: ${{ needs.restore.result == 'success' }}

  qtbase:
    needs: [plan, restore, mesa]
    if: >-
      always() && needs.plan.outputs.build_qtbase == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: qtbase
          packages: ${{ needs.plan.outputs.pkgs_qtbase }}
          ccache-size: 1500M
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}

  device:
    needs: [plan, restore, linux, base]
    if: >-
      always() && needs.plan.outputs.build_device == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: device
          packages: ${{ needs.plan.outputs.pkgs_device }}
          ccache-size: 500M
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}

  kde:
    needs: [plan, restore, mesa, base, qtbase]
    if: >-
      always() && needs.plan.outputs.build_kde == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: kde
          packages: ${{ needs.plan.outputs.pkgs_kde }}
          ccache-size: 1G
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}

  dac:
    needs: [plan, restore, linux, mesa, base, qtbase, device, kde]
    if: >-
      always() && needs.plan.outputs.build_dac == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - uses: ./.github/actions/nura-build
        with:
          group: dac
          packages: ${{ needs.plan.outputs.pkgs_dac }}
          ccache-size: 500M
          privkey: ${{ secrets.NURA_REPO_PRIVKEY }}

  # Pages replaces the whole site on every deployment: start from what is published, add this
  # run's packages, drop every version that is not the pmos branch's, index, sign, write
  # built.json, carry the arch part of the live site over (../common/site.py), deploy. Same
  # concurrency group as the arch workflow's publish job.
  publish:
    needs: [plan, restore, linux, mesa, base, qtbase, device, kde, dac]
    if: >-
      always() && needs.plan.outputs.any == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: pages-site
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.plan.outputs.pmos_sha }}", path: pmos }
      - run: mkdir -p "$(dirname "$NURA_PMOS")" "$(dirname "$NURA_WORK")" "$(dirname "$NURA_TOOLS")" && mv pmos "$NURA_PMOS"
      - name: Set up pmbootstrap
        env:
          NURA_REPO_PRIVKEY: ${{ secrets.NURA_REPO_PRIVKEY }}
        run: .github/nura/setup.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          merge-multiple: true
          path: ${{ runner.temp }}/run-apks
      - name: Merge, prune and index
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
          MANIFEST: ${{ needs.plan.outputs.manifest }}
        run: |
          .github/nura/seed.sh "$NURA_REPO_URL/edge" "$RUNNER_TEMP/run-apks"
          repo=$NURA_WORK/packages/edge/aarch64
          printf '%s' "$VERSIONS" > "$RUNNER_TEMP/versions.json"
          python3 -I .github/nura/apkindex.py prune "$repo/APKINDEX.tar.gz" "$RUNNER_TEMP/versions.json" \
            > "$RUNNER_TEMP/prune"
          if [ -s "$RUNNER_TEMP/prune" ]; then
            echo "dropping:"; cat "$RUNNER_TEMP/prune"
            (cd "$repo" && xargs sudo rm -f < "$RUNNER_TEMP/prune")
            pmbootstrap -y --details-to-stdout index
          fi
          site=$RUNNER_TEMP/site
          mkdir -p "$site/edge/aarch64"
          cp "$repo"/*.apk "$repo/APKINDEX.tar.gz" "$site/edge/aarch64/"
          cp "keys/$KEY_NAME.pub" "$site/"
          sed -e "s|@KEY_NAME@|$KEY_NAME|g" -e "s|@REPO_URL@|$NURA_REPO_URL|g" \
            -e "s|@PMOS_SHA@|${{ needs.plan.outputs.pmos_sha }}|g" \
            .github/nura/index.html > "$site/index.html"
          python3 -I .github/nura/apkindex.py files "$site/edge/aarch64/APKINDEX.tar.gz" | sort > "$site/edge/aarch64/packages.txt"
          printf '%s\n' "$MANIFEST" | python3 -m json.tool --sort-keys > "$site/edge/aarch64/built.json"
          python3 -I .github/common/site.py list "$site" nura
          python3 -I .github/common/site.py fetch "$NURA_REPO_URL" arch "$site"
          du -sh "$site"
          {
            echo "## Published"
            echo
            echo "$(wc -l < "$site/edge/aarch64/packages.txt") packages, $(du -sh "$site" | cut -f1), pmos ${{ needs.plan.outputs.pmos_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v5

  # YuruMirror gets the same files: what publish deployed, or the live site when this run deployed
  # nothing (skips without the mirror secrets).
  mirror:
    needs: [plan, publish]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Tailscale workload identity federation
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mirror
        with:
          part: nura
          deployed: ${{ needs.publish.result == 'success' }}
          site-url: ${{ env.NURA_REPO_URL }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          remote-dir: ${{ secrets.REMOTE_DIR }}
