name: Build a group of Nura packages
description: >
  Set up pmbootstrap, fill its local repository with the published packages and this run's
  earlier builds and cache restores, build the given packages for aarch64 one by one, save each one
  in the actions cache under its hash as soon as it is built, and upload them all as the artifact
  apks-<group>. Expects the workflow repository in the workspace root and the pmos branch in
  $NURA_PMOS.

inputs:
  group:
    description: job name, used for the cache keys and the artifact name
    required: true
  packages:
    description: >
      JSON list of {"name", "key"} to build, in order (plan.py pkgs_<group>); key is the actions
      cache key the package is saved under. At most 6: one build and one save step per slot below.
    required: true
  ccache-size:
    description: ccache size limit
    default: 1G
  privkey:
    description: repository signing key (PEM)
    required: true
  after-builds:
    description: whether earlier jobs of this run uploaded packages (apks-*) to seed from
    default: "true"

runs:
  using: composite
  steps:
    - name: Runner
      shell: bash
      run: nproc; free -g; df -h

    - name: Restore ccache and distfiles
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.NURA_WORK }}/cache_ccache_aarch64
          ${{ env.NURA_WORK }}/cache_distfiles
        key: nura-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: nura-${{ inputs.group }}-

    - name: Set up pmbootstrap
      shell: bash
      env:
        NURA_REPO_PRIVKEY: ${{ inputs.privkey }}
        NURA_CCACHE_SIZE: ${{ inputs.ccache-size }}
      run: |
        .github/nura/setup.sh
        # The restored caches belong to the runner user; in the chroots they are the pmos user's
        # (uid 12345, group abuild = 300 for distfiles).
        sudo mkdir -p "$NURA_WORK/cache_ccache_aarch64" "$NURA_WORK/cache_distfiles"
        sudo chown -R 12345:12345 "$NURA_WORK/cache_ccache_aarch64"
        sudo chown -R 12345:300 "$NURA_WORK/cache_distfiles"
        sudo chmod -R g+w "$NURA_WORK/cache_distfiles"

    - name: Download this run's packages
      if: inputs.after-builds == 'true'
      uses: actions/download-artifact@v4
      with:
        pattern: apks-*
        merge-multiple: true
        path: ${{ runner.temp }}/run-apks

    - name: Seed the local repository
      shell: bash
      run: .github/nura/seed.sh "$NURA_REPO_URL" "$RUNNER_TEMP/run-apks"

    # One build step and one cache step per package slot (GitHub has no loops over steps). A build
    # step runs when its slot is filled and nothing before it failed; the cache step right after it
    # saves the package, so a later failure or a cancelled run keeps it for the next run.
    - name: Build ${{ fromJSON(inputs.packages)[0].name }}
      id: b0
      if: fromJSON(inputs.packages)[0] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[0].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[0].name }}
      if: steps.b0.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[0].name }}
        key: ${{ fromJSON(inputs.packages)[0].key }}

    - name: Build ${{ fromJSON(inputs.packages)[1].name }}
      id: b1
      if: fromJSON(inputs.packages)[1] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[1].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[1].name }}
      if: steps.b1.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[1].name }}
        key: ${{ fromJSON(inputs.packages)[1].key }}

    - name: Build ${{ fromJSON(inputs.packages)[2].name }}
      id: b2
      if: fromJSON(inputs.packages)[2] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[2].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[2].name }}
      if: steps.b2.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[2].name }}
        key: ${{ fromJSON(inputs.packages)[2].key }}

    - name: Build ${{ fromJSON(inputs.packages)[3].name }}
      id: b3
      if: fromJSON(inputs.packages)[3] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[3].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[3].name }}
      if: steps.b3.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[3].name }}
        key: ${{ fromJSON(inputs.packages)[3].key }}

    - name: Build ${{ fromJSON(inputs.packages)[4].name }}
      id: b4
      if: fromJSON(inputs.packages)[4] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[4].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[4].name }}
      if: steps.b4.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[4].name }}
        key: ${{ fromJSON(inputs.packages)[4].key }}

    - name: Build ${{ fromJSON(inputs.packages)[5].name }}
      id: b5
      if: fromJSON(inputs.packages)[5] != null
      shell: bash
      run: .github/nura/build.sh "$RUNNER_TEMP/out" "${{ fromJSON(inputs.packages)[5].name }}"
    - name: Cache ${{ fromJSON(inputs.packages)[5].name }}
      if: steps.b5.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.NURA_PKGCACHE }}/${{ fromJSON(inputs.packages)[5].name }}
        key: ${{ fromJSON(inputs.packages)[5].key }}

    - name: Prepare ccache and distfiles for saving
      if: always() && (steps.b0.outcome == 'success' || steps.b0.outcome == 'failure')
      shell: bash
      run: |
        pmbootstrap -y shutdown || true
        sudo chmod -R a+rX "$NURA_WORK/cache_ccache_aarch64" "$NURA_WORK/cache_distfiles" || true
        sudo du -sh "$NURA_WORK"/cache_* || true
        df -h

    - name: Save ccache and distfiles
      if: always() && (steps.b0.outcome == 'success' || steps.b0.outcome == 'failure')
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.NURA_WORK }}/cache_ccache_aarch64
          ${{ env.NURA_WORK }}/cache_distfiles
        key: nura-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: apks-${{ inputs.group }}
        path: ${{ runner.temp }}/out/*.apk
        if-no-files-found: error
        retention-days: 7
